name: Build Khavaran Desk Windows
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: khavaran-build
  package-windows:
    needs: build
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: rustdesk-unsigned-windows-x86_64
        path: build/windows-bundle
    - name: Install NSIS
      run: choco install nsis --yes --no-progress
    - name: Build Khavaran installer
      shell: pwsh
      working-directory: build
      run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" windows-installer.nsi'
    - uses: actions/upload-artifact@v4
      with:
        name: KhavaranDesk-Windows-Setup
        path: build/KhavaranDesk-Setup-x64.exe
        if-no-files-found: error
  publish:
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: KhavaranDesk-Windows-Setup
        path: dist
    - name: Publish Windows installer
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BUILD_SHA: ${{ github.sha }}
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        set -euo pipefail
        cd dist
        sha256sum KhavaranDesk-Setup-x64.exe > KhavaranDesk-Setup-x64.exe.sha256
        tag="windows-build-${BUILD_NUMBER}"
        if ! gh release view "$tag" >/dev/null 2>&1; then
          gh release create "$tag" --target "$BUILD_SHA" --title "Khavaran Desk Windows — build ${BUILD_NUMBER}" --notes "Windows x64 installer with Khavaran dashboard and server configuration. Unsigned build; Windows runtime verification pending." --prerelease
        fi
        gh release upload "$tag" KhavaranDesk-Setup-x64.exe KhavaranDesk-Setup-x64.exe.sha256 --clobber
'on':
  push:
    branches:
    - main
    paths:
    - '.github/workflows/flutter-build.yml'
    - '.github/workflows/bridge.yml'
    - '.github/workflows/third-party-RustDeskTempTopMostWindow.yml'
    - '.github/workflows/khavaran.yml'
    - 'build/redesign.py'
    - 'build/bootstrap.py'
    - 'build/khavaran.patch'
    - 'build/identity.patch'
    - 'build/icon.b64'
    - 'build/windows-installer.nsi'
  workflow_dispatch: {}

