name: Build Khavaran Desk Windows Client

permissions:
  contents: read

'on':
  push:
    branches:
      - main
      - codex/khavaran-persian-workspace
    paths:
      - '.github/workflows/flutter-build.yml'
      - '.github/workflows/bridge.yml'
      - '.github/workflows/third-party-RustDeskTempTopMostWindow.yml'
      - '.github/workflows/khavaran.yml'
      - 'build/redesign.py'
      - 'build/repair_client.py'
      - 'build/polish_client.py'
      - 'build/ui/**'
      - 'build/fonts/**'
      - 'build/bootstrap.py'
      - 'build/khavaran.patch'
      - 'build/identity.patch'
      - 'build/network.patch'
      - 'build/icon.b64'
      - 'build/windows-installer.nsi'
  pull_request:
    branches:
      - main
      - codex/khavaran-persian-workspace
    paths:
      - '.github/workflows/flutter-build.yml'
      - '.github/workflows/bridge.yml'
      - '.github/workflows/third-party-RustDeskTempTopMostWindow.yml'
      - '.github/workflows/khavaran.yml'
      - 'build/redesign.py'
      - 'build/repair_client.py'
      - 'build/polish_client.py'
      - 'build/ui/**'
      - 'build/fonts/**'
      - 'build/bootstrap.py'
      - 'build/khavaran.patch'
      - 'build/identity.patch'
      - 'build/network.patch'
      - 'build/icon.b64'
      - 'build/windows-installer.nsi'
  workflow_dispatch: {}

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: khavaran-build

  package-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: build/windows-bundle

      - name: Package portable Windows client
        shell: pwsh
        run: |
          $bundle = "build/windows-bundle"
          if (-not (Test-Path "$bundle/rustdesk.exe")) {
            throw "Portable executable not found"
          }
          Copy-Item $bundle "build/KhavaranDesk-Portable-x64" -Recurse
          Rename-Item "build/KhavaranDesk-Portable-x64/rustdesk.exe" "khavarandesk.exe"
          Copy-Item "LICENSE" "build/KhavaranDesk-Portable-x64/LICENSE"
          @'
          Extract the entire folder, then run khavarandesk.exe.
          No installation or administrator access is required for ordinary sessions.
          Settings are stored in the current user's application data directory.
          Close an older Khavaran Desk installation before testing this build.
          Unattended access after reboot requires the installed service version.
          '@ | Set-Content "build/KhavaranDesk-Portable-x64/README.txt" -Encoding utf8
          Compress-Archive -Path "build/KhavaranDesk-Portable-x64" -DestinationPath "build/KhavaranDesk-Portable-Windows-x64.zip"

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build Khavaran installer
        shell: pwsh
        working-directory: build
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" windows-installer.nsi
          if (-not (Test-Path "KhavaranDesk-Setup-x64.exe")) {
            throw "NSIS output not found"
          }
          Move-Item "KhavaranDesk-Setup-x64.exe" "KhavaranDesk-Client-Windows-x64.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: KhavaranDesk-Client-Windows-x64
          path: |
            build/KhavaranDesk-Client-Windows-x64.exe
            build/KhavaranDesk-Portable-Windows-x64.zip
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KhavaranDesk-Client-Windows-x64
          path: dist

      - name: Publish Windows client
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum KhavaranDesk-Client-Windows-x64.exe > KhavaranDesk-Client-Windows-x64.exe.sha256
          sha256sum KhavaranDesk-Portable-Windows-x64.zip > KhavaranDesk-Portable-Windows-x64.zip.sha256
          tag="client-windows-build-${BUILD_NUMBER}"

          cat > release-notes.md <<'EOF'
          Khavaran Desk Windows Client

          - Persian-first UI with real RTL layout
          - live connection status on the main page
          - updated managed server public key
          - portable ZIP: extract the full folder and run khavarandesk.exe
          - fixed managed ID / Relay / HTTPS API / public key
          - server addresses and configuration dialog hidden
          - responsive Khavaran Desk desktop dashboard

          Unsigned Windows build. Validate on a Windows device before production deployment.
          EOF

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag"               --target "$BUILD_SHA"               --title "Khavaran Desk Client — Windows x64 build ${BUILD_NUMBER}"               --notes-file release-notes.md               --prerelease
          fi

          gh release upload "$tag"             KhavaranDesk-Client-Windows-x64.exe             KhavaranDesk-Client-Windows-x64.exe.sha256             KhavaranDesk-Portable-Windows-x64.zip             KhavaranDesk-Portable-Windows-x64.zip.sha256             --clobber
